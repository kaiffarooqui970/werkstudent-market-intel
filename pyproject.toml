[project]
name = "werkstudent-market-intel"
version = "0.1.0"
description = "Modern data stack pipeline for the German student-job market"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "shap>=0.45.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
